name: Validate Part 1 Documentation

on:
  push:
    branches: [ main ]

jobs:
  validate-docs:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      run: |
        git clone https://github.com/${{ github.repository }}.git .
        git checkout ${{ github.sha }}
    
    - name: Check docs folder exists
      run: |
        if [ ! -d "docs" ]; then
          echo "Error: docs folder not found"
          exit 1
        fi
        echo "docs folder exists"
    
    - name: List docs folder contents
      run: |
        echo "Files in docs folder:"
        ls -la docs/
    
    - name: Check for ERD image
      run: |
        cd docs
        if ls *.png *.jpg *.jpeg *.PNG *.JPG *.JPEG 2>/dev/null; then
          echo "ERD image found"
        else
          echo "Error: No ERD image found"
          echo "Looking for: .png, .jpg, .jpeg"
          exit 1
        fi
    
    - name: Check for API Endpoint Plan
      run: |
        cd docs
        if ls *.md *.MD *.pdf *.PDF 2>/dev/null; then
          echo "API Endpoint Plan found"
        else
          echo "Error: No API Endpoint Plan found"
          echo "Looking for: .md, .pdf"
          exit 1
        fi
    
    - name: Check for SQL Script
      run: |
        cd docs
        if ls *.sql *.SQL 2>/dev/null; then
          echo "SQL Script found"
        else
          echo "Error: No SQL Script found"
          echo "Looking for: .sql"
          exit 1
        fi
    
    - name: Check README exists
      run: |
        if [ ! -f "README.md" ]; then
          echo "Error: README.md not found"
          exit 1
        fi
        echo "README.md exists"
    
    - name: Validation complete
      run: |
        echo "All Part 1 files validated successfully"
