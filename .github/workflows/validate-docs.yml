name: Validate Part 1 Documentation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-docs:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Check docs folder exists
      run: |
        if [ ! -d "docs" ]; then
          echo "Error: docs folder not found"
          exit 1
        fi
        echo "docs folder exists"

    - name: List docs folder contents
      run: |
        echo "Files in docs folder:"
        ls -la docs/

    - name: Check for ERD image
      run: |
        cd docs
        FOUND=$(ls | grep -iE '^ERD\.(png|jpg|jpeg)$' | head -1)
        if [ -z "$FOUND" ]; then
          echo "Error: No ERD image found (looking for ERD.png, ERD.jpg, ERD.jpeg)"
          ls -la
          exit 1
        fi
        echo "ERD image found: $FOUND"

    - name: Check for API Endpoint Plan
      run: |
        cd docs
        FOUND=$(ls | grep -iE 'API.*Plan.*\.(md|pdf)$' | head -1)
        if [ -z "$FOUND" ]; then
          echo "Error: No API Endpoint Plan found"
          ls -la
          exit 1
        fi
        echo "API Endpoint Plan found: $FOUND"

    - name: Check for SQL Script
      run: |
        cd docs
        FOUND=$(ls | grep -iE '\.sql$' | head -1)
        if [ -z "$FOUND" ]; then
          echo "Error: No SQL Script found"
          ls -la
          exit 1
        fi
        echo "SQL Script found: $FOUND"

    - name: Check README exists
      run: |
        if [ ! -f "README.md" ]; then
          echo "Error: README.md not found"
          exit 1
        fi
        echo "README.md exists"

    - name: Validation complete
      run: |
        echo "All Part 1 files validated successfully"