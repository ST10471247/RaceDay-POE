name: RaceDay API Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore RaceDay.sln

    - name: Build API
      run: dotnet build RaceDay.Api/RaceDay.Api.csproj --no-restore --configuration Release

    - name: Build Tests
      run: dotnet build RaceDay.Tests/RaceDay.Tests.csproj --no-restore --configuration Release

    - name: Run Tests
      run: dotnet test RaceDay.Tests/RaceDay.Tests.csproj --no-build --configuration Release --verbosity normal